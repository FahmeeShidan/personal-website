<!DOCTYPE html>
<html>
<head>
    <title>Calculator</title>
    <link rel="stylesheet" href="../CSS/style.css">
</head>
<body>
    <header>
        <h1>Calculator</h1>
        <p>Basic arithmetic calculator</p>
    </header>
    <nav>
        <a href="Main.html">Home</a>
        <a href="PersonalInfo.html">Personal Information</a>
        <a href="Tools.html">Useful Tools</a>
    </nav>
    <div class="container">
        <div class="card">
            <h2>Calculator</h2>
            <p>
                Enter two numbers and choose an operation.
            </p>
            <p>
                <label>First Number:</label><br>
                <input type="number" id="num1">
            </p>
            <p>
                <label>Second Number:</label><br>
                <input type="number" id="num2">
            </p>
            <p>
                <button onclick="add()">Add</button>
                <button onclick="subtract()">Subtract</button>
                <button onclick="multiply()">Multiply</button>
                <button onclick="divide()">Divide</button>
                <button onclick="clearResult()">Clear</button>
            </p>
            <p>
                <label>Result:</label><br>
                <input type="text" id="result" readonly>
            </p>
        </div>
        <div class="card">
            <a href="Tools.html" class="button">Back to Useful Tools</a>
        </div>
    </div>
    <footer>
        <p>© 2026 Muhammad Fahmee Bin Shidan</p>
    </footer>
    <script>
        function add() {
            let num1 = Number(document.getElementById("num1").value);
            let num2 = Number(document.getElementById("num2").value);

            document.getElementById("result").value = num1 + num2;
        }
        function subtract() {
            let num1 = Number(document.getElementById("num1").value);
            let num2 = Number(document.getElementById("num2").value);

            document.getElementById("result").value = num1 - num2;
        }
        function multiply() {
            let num1 = Number(document.getElementById("num1").value);
            let num2 = Number(document.getElementById("num2").value);

            document.getElementById("result").value = num1 * num2;
        }
        function divide() {
            let num1 = Number(document.getElementById("num1").value);
            let num2 = Number(document.getElementById("num2").value);
            if (num2 === 0) {
                document.getElementById("result").value = "Cannot divide by zero";
            } else {
                document.getElementById("result").value = num1 / num2;
            }
        }
        function clearResult() {
            document.getElementById("num1").value = "";
            document.getElementById("num2").value = "";
            document.getElementById("result").value = "";
        }
    </script>
</body>
</html>
