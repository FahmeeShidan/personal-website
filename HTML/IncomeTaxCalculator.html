<!DOCTYPE html>
<html>
<head>
    <title>Income Tax Calculator</title>
    <link rel="stylesheet" href="../CSS/style.css">
</head>
<body>
    <header>
        <h1>Income Tax Calculator</h1>
        <p>Calculate your estimated income tax</p>
    </header>
    <nav>
        <a href="Main.html">Home</a>
        <a href="PersonalInfo.html">Personal Information</a>
        <a href="Tools.html">Useful Tools</a>
    </nav>
    <div class="container">
        <div class="card">
            <h2>Income Tax Calculator</h2>
            <p>
                Enter your yearly income to calculate your estimated income tax.
            </p>
            <p>
                <label>Yearly Income (RM):</label><br>
                <input type="number" id="income">
            </p>
            <p>
                <button onclick="calculateTax()">Calculate Tax</button>
            </p>
            <p>
                <label>Tax Amount (RM):</label><br>
                <input type="text" id="tax" readonly>
            </p>
        </div>
        <div class="card">
            <a href="Tools.html" class="button">Back to Useful Tools</a>
        </div>
    </div>
    <footer>
        <p>© 2026 Muhammad Fahmee Bin Shidan</p>
    </footer>
    <script>
        function calculateTax() {

            let income = Number(document.getElementById("income").value);
            let tax = 0;

            if (income <= 5000) {
                tax = 0;
            }
            else if (income <= 20000) {
                tax = (income - 5000) * 0.01;
            }
            else if (income <= 35000) {
                tax = 150 + (income - 20000) * 0.03;
            }
            else if (income <= 50000) {
                tax = 600 + (income - 35000) * 0.08;
            }
            else if (income <= 70000) {
                tax = 1800 + (income - 50000) * 0.13;
            }
            else if (income <= 100000) {
                tax = 4400 + (income - 70000) * 0.21;
            }
            else if (income <= 250000) {
                tax = 10700 + (income - 100000) * 0.24;
            }
            else if (income <= 400000) {
                tax = 46700 + (income - 250000) * 0.245;
            }
            else if (income <= 600000) {
                tax = 83450 + (income - 400000) * 0.25;
            }
            else if (income <= 1000000) {
                tax = 133450 + (income - 600000) * 0.26;
            }
            else if (income <= 2000000) {
                tax = 237450 + (income - 1000000) * 0.28;
            }
            else {
                tax = 517450 + (income - 2000000) * 0.30;
            }
            document.getElementById("tax").value = tax.toFixed(2);
        }
    </script>
</body>
</html>
